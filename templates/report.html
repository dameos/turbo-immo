<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --ink: #1c2230; --muted: #78808f; --line: #dfe3ea; --bg: #f4f6f9;
    --card: #fff; --accent: #e4572e; --immoweb: #1a2b4a; --zimmo: #7a8699;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.01em; }
  .summary { color: var(--muted); font-size: 14px; }
  .counts { margin-top: 12px; display: flex; gap: 7px; flex-wrap: wrap; }
  .count {
    background: #fff; border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 11px; font-size: 12.5px;
  }
  .count b { font-weight: 700; }

  .warnings {
    margin: 16px 0 0; padding: 11px 14px; border-radius: 8px;
    background: #fff4ed; border: 1px solid #f3c9b3; color: #8a3b16; font-size: 13px;
  }
  .warnings ul { margin: 6px 0 0; padding-left: 18px; }

  .cards { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }

  .card {
    display: flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(20,30,50,.07);
  }
  .photos { display: flex; flex: none; gap: 6px; padding: 0; }
  .photos img, .photos .noimg {
    display: block; object-fit: cover; background: #e9ecf1;
  }
  .photos .hero { width: 250px; height: 210px; }
  .photos .hero.wide { width: 360px; }
  .photos .stack { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 6px 6px; }
  .photos .stack img { width: 110px; height: 99px; border-radius: 5px; }
  .photos .stack img.tall { height: 198px; }
  .noimg {
    width: 250px; height: 210px; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 12px;
  }

  .info { flex: 1; padding: 13px 16px; min-width: 0; }
  .price-row { display: flex; align-items: baseline; gap: 10px; }
  .price { font-size: 23px; font-weight: 800; letter-spacing: -.02em; }
  .ppm { color: var(--muted); font-size: 12px; }
  .street { font-weight: 700; font-size: 14px; margin-top: 3px; }
  .city { color: var(--muted); font-size: 12.5px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; }
  .chip {
    background: #eef0f4; color: #39404d; border-radius: 20px;
    padding: 3px 10px; font-size: 12px; font-weight: 600;
  }
  .chip.epc { background: #e6f3e8; color: #245c31; }
  /* a bedroom count we recovered ourselves, not one the site published */
  .chip.est {
    background: #fff4ed; color: #8a3b16; border: 1px dashed #e0b39a; cursor: help;
  }
  .links { display: flex; gap: 5px; margin-top: 11px; }
  .badge {
    color: #fff; border-radius: 4px; padding: 3px 8px; font-size: 10px;
    font-weight: 700; letter-spacing: .04em; text-decoration: none;
  }
  .badge.immoweb { background: var(--immoweb); }
  .badge.zimmo { background: var(--zimmo); }

  .map { position: relative; flex: none; width: 340px; height: 210px;
         overflow: hidden; background: #e8e4dd; }
  .map .mosaic { position: absolute; }
  .map .mosaic div {
    position: absolute; width: 256px; height: 256px;
    background-size: 256px 256px; background-repeat: no-repeat;
  }
  .map .pin {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent);
    border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.5);
  }
  .map .attr {
    position: absolute; right: 4px; bottom: 3px; font-size: 9.5px; color: #5a5a5a;
    background: rgba(255,255,255,.75); padding: 0 4px; border-radius: 3px;
  }
  .map.absent {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; background: #eceff3;
  }

  footer { margin-top: 30px; color: var(--muted); font-size: 12px; }
  .empty { background: #fff; border: 1px solid var(--line); border-radius: 12px;
           padding: 30px; text-align: center; color: var(--muted); }

  @media print { body { background: #fff; } .card { break-inside: avoid; } }

  /* one rule per unique map tile, so a shared tile is embedded only once */
{{TILE_CSS|raw}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <div class="summary">{{SUMMARY}}</div>
    <div class="counts">{{COUNTS|raw}}</div>
    {{WARNINGS|raw}}
  </header>

  <main class="cards">{{CARDS|raw}}</main>

  <footer>
    Generated {{GENERATED}} · Map data {{ATTRIBUTION}} · {{STATS}}
  </footer>
</div>
</body>
</html>
